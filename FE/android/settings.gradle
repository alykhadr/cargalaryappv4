pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(
        "/bin/zsh",
        "-lc",
        '''
        NODE_CANDIDATE="${NODE_BINARY:-$(command -v node 2>/dev/null)}"
        if [ -z "$NODE_CANDIDATE" ]; then
          for candidate in /opt/homebrew/bin/node /usr/local/bin/node /usr/bin/node "$HOME"/.nvm/versions/node/*/bin/node; do
            if [ -x "$candidate" ]; then
              NODE_CANDIDATE="$candidate"
              break
            fi
          done
        fi
        [ -n "$NODE_CANDIDATE" ] || { echo "Unable to locate Node.js. Set NODE_BINARY before running Gradle." >&2; exit 1; }
        exec "$NODE_CANDIDATE" --print "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
        '''
      )
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(
        "/bin/zsh",
        "-lc",
        '''
        NODE_CANDIDATE="${NODE_BINARY:-$(command -v node 2>/dev/null)}"
        if [ -z "$NODE_CANDIDATE" ]; then
          for candidate in /opt/homebrew/bin/node /usr/local/bin/node /usr/bin/node "$HOME"/.nvm/versions/node/*/bin/node; do
            if [ -x "$candidate" ]; then
              NODE_CANDIDATE="$candidate"
              break
            fi
          done
        fi
        [ -n "$NODE_CANDIDATE" ] || { echo "Unable to locate Node.js. Set NODE_BINARY before running Gradle." >&2; exit 1; }
        exec "$NODE_CANDIDATE" --print "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"
        '''
      )
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'Carea'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
